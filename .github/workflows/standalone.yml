name: Standalone

# CarrierSIM without Python: one PyInstaller build per OS, attested and attached to the
# draft release that release.yml creates for the same tag. Manual runs keep the builds as
# workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel, windows-latest]
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify version matches the tag
        if: github.ref_type == 'tag'
        run: python -c 'import os; from carriersim_version import VERSION; assert VERSION == os.environ["TAG"], "Version differs from tag"'
      - name: Install dependencies through the CarrierSIM launcher and PyInstaller
        run: |
          python -c "import launch, sys; sys.exit(0 if launch.install_dependencies(sys.executable, sys.version_info[:2]) else 1)"
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
      - name: Build and smoke-test
        run: python .github/scripts/build-standalone.py "$TAG" dist
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/CarrierSIM-*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CarrierSIM-${{ env.TAG }}-${{ matrix.os }}
          path: dist/CarrierSIM-*.zip
          if-no-files-found: error
      - name: Attach to the draft release
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # release.yml creates the draft after Tests pass; never touch a published release.
          for attempt in $(seq 1 90); do
            if gh release view "$TAG" --json isDraft > release.json; then
              python -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to modify a published release"'
              gh release upload "$TAG" dist/CarrierSIM-*.zip --clobber
              exit 0
            fi
            sleep 20
          done
          echo "Draft release $TAG did not appear" >&2
          exit 1
